name: CI

on:
  push:
  pull_request:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Rust tests (library, fixture adapters)
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Clippy (library)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --all-targets -- -D warnings
      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Rust tests on Windows (includes Windows adapter compilation)
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Clippy (desktop + Windows adapter)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Portable build
        shell: pwsh
        run: ./scripts/build-portable.ps1 -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: MigrationAssistant-portable
          path: dist-portable/MigrationAssistant
